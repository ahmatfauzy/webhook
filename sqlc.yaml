version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "migrations/000001_init.up.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
