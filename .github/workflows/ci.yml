name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webhooker
          POSTGRES_PASSWORD: webhooker
          POSTGRES_DB: webhooker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://webhooker:webhooker@localhost:5432/webhooker?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      HTTP_ADDR: ":8080"
      ADMIN_TOKEN: ci-admin-token
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      WEBHOOK_ALLOW_PRIVATE_IPS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Format check
        run: |
          go fmt ./...
          git diff --exit-code || (echo "Run 'go fmt ./...' locally" && exit 1)

      - name: Lint
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1 -short

      - name: Run migrations
        run: go run ./cmd/webhooker migrate

      - name: Integration tests
        run: go test ./... -count=1 -run TestWorkerProcessDeliveryMock -v

      - name: Build
        run: go build -o /tmp/webhooker ./cmd/webhooker

      - name: Docker build
        run: docker build -t webhooker:ci .
